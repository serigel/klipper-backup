[gcode_macro PRINT_START]
description: Alias for START_PRINT
gcode:
  START_PRINT
[gcode_macro START_PRINT]
description: Start Printing
gcode:
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
  M140 S{BED_TEMP}                              ; Start bed heating
  M104 S{150}                         ; Start extuder heating
  
  # PrucaSlicer/SuperSlicer Start-G-Code
  #   START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature] 
  # Cura Start-G-Code
  #   START_PRINT BED_TEMP={material_bed_temperature_layer_0} EXTRUDER_TEMP={material_initial_print_temperature}
  
  #SET_GCODE_OFFSET Z=0.0                        ; Reset the G-Code Z offset (adjust Z offset if needed)

  G28                                           ; Home the printer
  G21                                           ; Set units to millimeters
  G90                                           ; Set all axes to absolute
  M82                                           ; E Absolute
  M107                                          ; Turn-off Fan
  G1 X0 Y0

  M190 S{BED_TEMP}                              ; Wait for bed to reach temperature
  BED_MESH_CALIBRATE ADAPTIVE=1
  BED_MESH_ADJ_FROM_TAP
  
  M109 S{150}                         ; Wait for nozzle to reach temperature
  ;_PRIME_LINE                                    ; First move
  
  G1 X170 Y170
  PROBE method=tap samples=3
  SET_Z_FROM_PROBE method=tap
  #SET_GCODE_OFFSET Z_ADJUST=+0.08 MOVE=1
  G1 X0 Y0 
  M104 S{EXTRUDER_TEMP}
  M109 S{EXTRUDER_TEMP}
  SET_VELOCITY_LIMIT ACCEL=1000
  VORON_PURGE
  
[gcode_macro PRINT_END]
description: Alias for END_PRINT
gcode:
  END_PRINT
[gcode_macro END_PRINT]
description: End Printing
gcode:
  # PrucaSlicer/SuperSlicer/Cura End-G-Code
  #   END_PRINT

  G91                                           ; Relative positioning
  G1 E-2 F2700                                  ; Retract a bit
  G1 E-2 Z0.2 F2400                             ; Retract and raise Z
  G1 Z10 F3000                                  ; Raise Z more
  G90                                           ; Absolute positionning
  G1 X5 Y5 F3000
  ;G1 X5 Y325 F3000                              ; Wipe out
  M107                                          ; Turn-off Fan
  M104 S0                                       ; Turn-off hotend
  M140 S0                                       ; Turn-off bed
  M84 X Y E                                     ; Disable all steppers but Z
  G90                                           ; Absolute Positioning
  M117 Print done                               ; Send finish to display

[gcode_macro _PRIME_LINE]
description: Print prime line
gcode:
  G1 Z3.0 F3000                                 ; Move Z Axis up
  G92 E0                                        ; Reset Extruder
  G1 X30 Y30.0 Z0.28 F3000
  G92 E0                                        ; Reset Extruder
  G1 X10 Y10 Z0.28 F3000.0                      ; Move to start position
  G1 X10 Y170.0 Z0.28 F1500.0 E12               ; Draw the first line
  G1 X10.3 Y10.0 Z0.28 F1500.0 E18              ; Draw the second line
  G92 E0                                        ; Reset Extruder
  G1 Z1.0 F3000                                 ; Move Z Axis up
  M117 Printing

[gcode_macro _RELOAD_Z_OFFSET_FROM_PROBE]
gcode:
    {% set Z = printer.toolhead.position.z %}
    M118 Z adjust {Z} -> {Z - printer.probe.last_probe_position.z}
    SET_KINEMATIC_POSITION Z={Z - printer.probe.last_probe_position.z}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    # METHOD=tap can only be configured with args to PROBE
    # Here are some defaults
    {% set METHOD = params.METHOD | default("automatic") %}
    {% set SAMPLES = params.SAMPLES | default(3) %}
    {% set PROBE_SPEED = params.PROBE_SPEED | default(5) %}
    {% set LIFT_SPEED = params.LIFT_SPEED | default(5) %}
    {% set SAMPLE_RETRACT_DIST = params.SAMPLE_RETRACT_DIST | default(2) %}
    PROBE METHOD={METHOD} SAMPLES={SAMPLES} PROBE_SPEED={PROBE_SPEED} LIFT_SPEED={LIFT_SPEED} SAMPLE_RETRACT_DIST={SAMPLE_RETRACT_DIST}
    _RELOAD_Z_OFFSET_FROM_PROBE
    G0 Z5

[gcode_macro BED_MESH_ADJ_FROM_TAP]
gcode:
	{% set is_absolute = printer.gcode_move.absolute_coordinates %}
	{% set zero_coords = printer.configfile.settings.bed_mesh.zero_reference_position %}
	G90
	G0 Z5 F300 # Z-Hop
	G0 X{zero_coords[0]} Y{zero_coords[1]} F3000
	SET_Z_FROM_PROBE METHOD=tap
	G0 Z5 F300 # Z-Hop
	{% if not is_absolute %}
	G91
	{% endif %}