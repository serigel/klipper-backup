############################################################################################################
#                                                                                                  #########
# FylingBear Reborn 2 Klipper Config                                                               #########
# See https://www.klipper3d.org/Config_Reference.html for a description of config settings.        #########
#                                                                                                  #########
############################################_EN_############################################################
#
# Creating Klipper Firmware:
# Run "make menuconfig" to use this configuration, the firmware must be compiled for
#   Micro-controller Architecture (STMicroelectronics STM32)
#   Processor model (STM32F407)
#   Bootloader offset (48KiB bootloader (MKS Robin Nano V3))
# For USB Connection use
#   Communication interface (USB (on PA11/PA12))
# For UART Connection use
#   Communication interface (Serial (on USART1 PA10/PA9)) Wifi Modul
#
# Compile Firmware with "make", move the generated file into your klipper_config folder for download.
# mv ~/klipper/out/klipper.bin ~/klipper_config/Robin_nano_6.bin
# Download and put the Robin_nano_6.bin file into your SD card, 
# Power down the printer and insert the SD card, now power on the printer, the Upadte process is stating
#
############################################################################################################

#####################################################################
#  Include Macros
[include eddy/eddy.cfg]
[include macros/*.cfg]
[include KAMP_Settings.cfg]
[include eddy.cfg]
[include timelapse.cfg]
#####################################################################

#####################################################################
#  MCU Settings
#####################################################################

[mcu]
# ls /dev/serial/by-id/*
serial: /dev/ttyS3
restart_method: command

#####################################################################
#  Printer Settings
#####################################################################

[printer]
kinematics: corexy
max_velocity: 250
square_corner_velocity: 5.0
max_accel: 5000
#max_accel_to_decel: 7000
max_z_velocity: 25
max_z_accel: 100

#####################################################################
#  Filament sensor
#####################################################################
[filament_switch_sensor filament_detection]
switch_pin: PE6
pause_on_runout: true
runout_gcode: PAUSE

#####################################################################
#  Calibration
#####################################################################
[screws_tilt_adjust] 
screw1: 0,46
screw1_name: front left screw
screw2: 263,46
screw2_name: front right screw
screw3: 263,271
screw3_name: back right screw
screw4: 0,271
screw4_name: back left screw
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4

[bed_mesh]

#speed: 200
# For the mesh dimensions below, the coordinates need to be reachable by the center of the probe. To calculate coordinates that will work, use the formula below:
# mesh x min = position_min_x + greater_of (15mm or x_offset) <--- in this term, only consider the x offset if it is positive, ignore if negative.
# mesh y min = position_min_y + greater_of (15mm or y_offset) <--- in this term, only consider the y offset if it is positive, ignore if negative.
# mesh x max = position_max_x - greater_of (15mm or |x_offset|) <--- in this term, only consider the x offset if it is negative, ignore if positive.
# mesh y max = position_max_y - greater_of (15mm or |y_offset|) <--- in this term, only consider the y offset if it is negative, ignore if positive.
# Example: Consider that you have a 300 x 300 bed with the max x and y positions being 300 and the min being 0. Your probe offsets are -20 for X and 10 for Y
# For mesh x min we ignore the x offset term because it is negative. Therefore mesh x min = 15
# For mesh y min we do not ignore the y offset term because it is positive but it is less than 15 so we use 15. Therefore mesh y min = 15
# For mesh x max we do not ignore the x offset term because it is negative. It is also greater than 15. Therefore mesh x max = 280
# For mesh y max we ignore the y offset term because it is positive but it is less than 15 so we use 15. Therefore mesh y max = 285
# The final result would be mesh_min: 15, 15 mesh_max: 280, 285
algorithm: bicubic
zero_reference_position: 175, 175
#scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan 
#^overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.
speed: 100
horizontal_move_z: 3
mesh_min: 45, 20                                                                  
mesh_max: 310,310                                                               
#probe_count: 7,5
probe_count: 5, 5
mesh_pps: 3, 3



[z_tilt]
z_positions: 
    398, 189
    -75, 189
points:
    10, 189
    270, 189
speed: 100
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.005

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT
    BED_MESH_CLEAR
    {% if not printer.z_tilt.applied %}
    _Z_TILT_ADJUST horizontal_move_z=8 retry_tolerance=1
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=3
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT

#####################################################################
#  Input Shaping Settings https://www.klipper3d.org/Resonance_Compensation.html
#####################################################################

#[input_shaper] 
#shaper_freq_x: 50
#shaper_freq_y: 50
#shaper_type: mzv

#####################################################################
# Other Settings
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
[firmware_retraction]
retract_length: 2
retract_speed: 20

[display_status]

[verify_heater heater_bed]
max_error: 130
check_gain_time: 300
hysteresis: 3
heating_gain: 1

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[respond]
[exclude_object]
#####################################################################
#  X Stepper Settings
#####################################################################
[tmc2208 stepper_x]
uart_pin: PD5
stealthchop_threshold: 999999
run_current: 1.0
hold_current: 0.500

[stepper_x] 
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4 
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15 
position_endstop: 0
position_max: 325
homing_speed: 50

#####################################################################
#  Y Stepper Settings
#####################################################################
[tmc2208 stepper_y]
uart_pin: PD7
stealthchop_threshold: 999999
run_current: 1.0
hold_current: 0.500

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PD2 
position_endstop: 0
position_max: 325
homing_speed: 50

#####################################################################
#  Z, Z1 Stepper Settings
#####################################################################
[tmc2208 stepper_z]
uart_pin: PD4
stealthchop_threshold: 999999
run_current: 0.650
hold_current: 0.400
[stepper_z]
step_pin: PB5
dir_pin: PB4 
enable_pin: !PB8 
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.315
homing_speed: 10
second_homing_speed: 2
position_min: -1.5
position_max: 325

[tmc2208 stepper_z1]
uart_pin: PD8
stealthchop_threshold: 999999
run_current: 0.650
hold_current: 0.400
[stepper_z1]
step_pin: PD15
dir_pin: PA1
enable_pin: !PA3
microsteps: 32
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop



#####################################################################
#  Extruder Stepper Settings
#####################################################################
[tmc2209 extruder]
uart_pin: PD9
run_current: 0.250
hold_current: 0.050
[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 32
rotation_distance: 8 ; https://www.klipper3d.org/Rotation_Distance.html
pressure_advance: 0.044
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5 
sensor_type: PT1000 
sensor_pin: PC1
pullup_resistor: 4700
#control: pid
#pid_Kp = 16.767
#pid_Ki = 0.735
#pid_Kd = 95.572
min_temp: 0
max_temp: 350
max_extrude_only_distance: 100
max_extrude_cross_section: 6.0
#####################################################################
#  Heater Bed Settings
#####################################################################
[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
#control: pid
#pid_Kp: 325.10
#pid_Ki: 63.35
#pid_Kd: 417.10
min_temp: 0
max_temp: 130

#####################################################################
#  Heater Fan
#####################################################################
[heater_fan heater_fan]
pin: PC14
max_power: 1.0
shutdown_speed: 1.0
heater: extruder
heater_temp: 50.0 # Shutdown FAN at 50°C
fan_speed: 1.0

#####################################################################
#  Fan 2x4010 + fan motherboard
#####################################################################
[fan]
pin: PB1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0

[include moonraker_obico_macros.cfg]

